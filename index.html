<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LuckyWinner — Base Sepolia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a; --surface: #111; --border: #222;
    --accent: #e8ff47; --accent2: #ff4757; --text: #f0f0f0;
    --muted: #555; --green: #47ffa0;
    --mono: 'Space Mono', monospace; --sans: 'Syne', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; padding: 24px; }
  a { color: var(--accent); }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 12px; }
  .logo { font-weight: 800; font-size: 26px; letter-spacing: -1px; }
  .logo span { color: var(--accent); }
  .badge { font-family: var(--mono); font-size: 10px; background: #001a0a; border: 1px solid #005522; color: #44ffaa; padding: 3px 8px; border-radius: 4px; vertical-align: middle; margin-left: 8px; }
  #wallet-btn { font-family: var(--mono); font-size: 12px; background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: all .15s; }
  #wallet-btn:hover { border-color: var(--accent); color: var(--accent); }
  #wallet-btn.connected { border-color: var(--green); color: var(--green); }

  .tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .tab { font-family: var(--mono); font-size: 12px; padding: 8px 16px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; background: none; border-top: none; border-left: none; border-right: none; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel { display: none; }
  .panel.active { display: block; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .card-title { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; }

  label { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; margin-bottom: 6px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input[type=text], input[type=number] { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 13px; padding: 9px 12px; border-radius: 6px; outline: none; transition: border-color .15s; }
  input:focus { border-color: var(--accent); }

  .btn { display: inline-block; margin-top: 16px; padding: 10px 22px; font-family: var(--mono); font-size: 12px; border-radius: 6px; cursor: pointer; border: none; transition: all .15s; font-weight: 700; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: #d4eb00; }
  .btn-danger { background: transparent; border: 1px solid var(--accent2); color: var(--accent2); }
  .btn-danger:hover { background: var(--accent2); color: #fff; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }

  .round-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .round-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .round-card:hover { border-color: #333; }
  .round-id { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-bottom: 8px; }
  .round-state { display: inline-block; font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 20px; margin-bottom: 12px; }
  .state-OPEN        { background: #0a2a0a; color: var(--green);  border: 1px solid #1a5a1a; }
  .state-READY       { background: #0a1a2a; color: #47aaff;       border: 1px solid #1a4a7a; }
  .state-CALCULATING { background: #1a1a0a; color: #ffcc44;       border: 1px solid #4a4a0a; }
  .state-FROZEN      { background: #0a1a2a; color: #88ccff;       border: 1px solid #1a4a6a; }
  .state-COMPLETED   { background: #1a0a1a; color: #cc88ff;       border: 1px solid #4a1a4a; }
  .round-stat { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .round-stat span:last-child { color: var(--text); }
  .progress-bar { height: 3px; background: var(--border); border-radius: 2px; margin: 10px 0; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
  .round-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .round-actions .btn { margin-top: 0; padding: 6px 14px; font-size: 11px; }

  #log { font-family: var(--mono); font-size: 11px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; max-height: 220px; overflow-y: auto; margin-top: 16px; }
  .log-line { padding: 3px 0; border-bottom: 1px solid #1a1a1a; }
  .log-line:last-child { border-bottom: none; }
  .log-ok   { color: var(--green); }
  .log-err  { color: var(--accent2); }
  .log-info { color: var(--muted); }
  .log-tx   { color: #ffcc44; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hint { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 6px; }
  .empty { text-align: center; font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 40px; }
  hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

  .balance-bar { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); background: #0a0f0a; border: 1px solid #1a2a1a; border-radius: 6px; padding: 8px 14px; margin-bottom: 20px; }
  .balance-bar span { color: var(--green); font-size: 13px; }
  @media (max-width: 600px) { .two-col { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <div class="logo">Lucky<span>Winner</span> <span class="badge">BASE SEPOLIA</span></div>
  <button id="wallet-btn" onclick="connectWallet()">Connect Wallet</button>
</header>

<!-- BALANCE BAR -->
<div class="balance-bar" id="balance-bar" style="display:none">
  MockUSDT balance: <span id="usdt-balance">—</span> &nbsp;|&nbsp;
  <button class="btn btn-ghost" style="margin-top:0;padding:4px 12px;font-size:11px" onclick="doMint()">+ Mint 1000 USDT</button>
  <button class="btn btn-ghost" style="margin-top:0;padding:4px 12px;font-size:11px;margin-left:4px" onclick="refreshBalance()">↻</button>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('rounds')">Active Rounds</button>
  <button class="tab" onclick="showTab('enter')">Enter Round</button>
  <button class="tab" onclick="showTab('admin')">Admin</button>
</div>

<!-- ROUNDS PANEL -->
<div id="panel-rounds" class="panel active">
  <div class="card">
    <div class="card-title">Live Rounds</div>
    <button class="btn btn-ghost" style="margin-top:0;margin-bottom:16px" onclick="loadRounds()">↻ Refresh</button>
    <div id="rounds-container"><div class="empty">Connect wallet and click Refresh</div></div>
  </div>
</div>

<!-- ENTER PANEL -->
<div id="panel-enter" class="panel">
  <div class="card">
    <div class="card-title">Buy a Ticket</div>
    <label>Round ID</label>
    <input type="number" id="enter-roundId" min="0" placeholder="0"/>
    <p class="hint">Approves exact ticket price then enters the round in two txs.</p>
    <button class="btn btn-primary" onclick="doEnter()">Approve & Enter</button>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="panel-admin" class="panel">
  <div class="two-col">
    <div class="card">
      <div class="card-title">Create Round</div>
      <label>Ticket Price (USDT whole number)</label>
      <input type="number" id="cr-price" placeholder="10" min="1"/>
      <label>Max Players</label>
      <input type="number" id="cr-max" placeholder="5" min="2"/>
      <label>Protocol Fee %  (0 – 20)</label>
      <input type="number" id="cr-fee" placeholder="5" min="0" max="20"/>
      <button class="btn btn-primary" onclick="doCreateRound()">Create</button>
    </div>
    <div class="card">
      <div class="card-title">Draw / Freeze / Manual</div>
      <label>Round ID</label>
      <input type="number" id="adm-roundId" placeholder="0" min="0"/>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <button class="btn btn-ghost" onclick="doDrawWinner()">Draw (VRF)</button>
        <button class="btn btn-danger" onclick="doFreeze()">Freeze</button>
      </div>
      <hr/>
      <label>Manual Winner Index (FROZEN only)</label>
      <input type="number" id="adm-winnerIdx" placeholder="0" min="0"/>
      <button class="btn btn-ghost" onclick="doManualDraw()">Manual Pick</button>
    </div>
  </div>
  <div class="two-col">
    <div class="card">
      <div class="card-title">Refund (FROZEN)</div>
      <label>Round ID</label>
      <input type="number" id="adm-refund-roundId" placeholder="0" min="0"/>
      <label>Player Address (blank = refund all)</label>
      <input type="text" id="adm-refund-player" placeholder="0x... or leave blank"/>
      <button class="btn btn-danger" onclick="doAdminRefund()">Refund</button>
    </div>
    <div class="card">
      <div class="card-title">Protocol Fees</div>
      <p class="hint" style="margin-top:0">Accumulated fees ready to withdraw.</p>
      <button class="btn btn-ghost" onclick="loadFees()" style="margin-top:12px">Check Balance</button>
      <div id="fees-display" style="font-family:var(--mono);font-size:20px;margin-top:12px;color:var(--accent)">—</div>
      <button class="btn btn-primary" onclick="doWithdrawFees()">Withdraw</button>
    </div>
  </div>
</div>

<div id="log"><div class="log-line log-info">// tx log</div></div>

<script>
// ─── HARDCODED ADDRESSES ───────────────────────────────────────
const CONTRACT_ADDR = '0x73B0124e624086acaA932d5a0252E3e9f66cAc1e';
const USDT_ADDR     = '0xfdC43A29086BaA6FA6CFE2007Bf6Fd21AA21c4eB';
const BASE_SEPOLIA_CHAIN_ID = '0x14a34'; // 84532

// ─── ABIs ──────────────────────────────────────────────────────
const RAFFLE_ABI = [
  "function createRound(uint256 ticketPrice, uint256 maxPlayers, uint256 protocolFeePercentage) external returns (uint256)",
  "function enter(uint256 roundId) external",
  "function drawWinner(uint256 roundId) external returns (uint256)",
  "function freezeRound(uint256 roundId) external",
  "function manualDrawWinner(uint256 roundId, uint256 winnerIndex) external",
  "function refundPlayer(uint256 roundId, address player) external",
  "function refundAll(uint256 roundId) external",
  "function withdrawFees() external",
  "function unclaimedFees() view returns (uint256)",
  "function getActiveRounds() view returns (uint256[])",
  "function getRound(uint256 roundId) view returns (tuple(uint256 roundId, uint8 state, address[] players, uint256 ticketPrice, uint256 maxPlayers, uint256 protocolFeePercentage, uint256 totalPool, uint256 vrfRequestId, bool completed, address winner, uint256 createdAt, uint256 completedAt))",
  "function getTicketCount(uint256 roundId, address player) view returns (uint256)"
];

const USDT_ABI = [
  "function approve(address spender, uint256 amount) external returns (bool)",
  "function allowance(address owner, address spender) view returns (uint256)",
  "function balanceOf(address account) view returns (uint256)",
  "function decimals() view returns (uint8)",
  "function mint(address to, uint256 amount) external"
];

const STATE_NAMES = ['OPEN','READY','CALCULATING','FROZEN','COMPLETED'];

// ─── STATE ─────────────────────────────────────────────────────
let provider, signer, userAddress;
let raffleContract, usdtContract;
const usdtDecimals = 6;

// ─── LOG ───────────────────────────────────────────────────────
function log(msg, type='info') {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.className = `log-line log-${type}`;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.prepend(line);
}
function logTx(hash) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.className = 'log-line log-tx';
  line.innerHTML = `[${new Date().toLocaleTimeString()}] tx: <a href="https://sepolia.basescan.org/tx/${hash}" target="_blank">${hash.slice(0,10)}…</a>`;
  el.prepend(line);
}

// ─── WALLET ────────────────────────────────────────────────────
async function connectWallet() {
  if (!window.ethereum) { log('MetaMask not found', 'err'); return; }
  try {
    await window.ethereum.request({ method: 'eth_requestAccounts' });
    const chainId = await window.ethereum.request({ method: 'eth_chainId' });
    if (chainId !== BASE_SEPOLIA_CHAIN_ID) {
      log('Switching to Base Sepolia…', 'info');
      try {
        await window.ethereum.request({
          method: 'wallet_switchEthereumChain',
          params: [{ chainId: BASE_SEPOLIA_CHAIN_ID }]
        });
      } catch(e) {
        if (e.code === 4902) {
          await window.ethereum.request({
            method: 'wallet_addEthereumChain',
            params: [{
              chainId: BASE_SEPOLIA_CHAIN_ID,
              chainName: 'Base Sepolia',
              nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
              rpcUrls: ['https://sepolia.base.org'],
              blockExplorerUrls: ['https://sepolia.basescan.org']
            }]
          });
        } else { log(e.message, 'err'); return; }
      }
    }
    provider = new ethers.BrowserProvider(window.ethereum);
    signer   = await provider.getSigner();
    userAddress = await signer.getAddress();
    raffleContract = new ethers.Contract(CONTRACT_ADDR, RAFFLE_ABI, signer);
    usdtContract   = new ethers.Contract(USDT_ADDR, USDT_ABI, signer);
    const btn = document.getElementById('wallet-btn');
    btn.textContent = userAddress.slice(0,6) + '…' + userAddress.slice(-4);
    btn.classList.add('connected');
    document.getElementById('balance-bar').style.display = 'flex';
    log(`Connected: ${userAddress}`, 'ok');
    refreshBalance();
  } catch(e) { log(e.message || 'Connect failed', 'err'); }
}

async function refreshBalance() {
  if (!usdtContract || !userAddress) return;
  try {
    const bal = await usdtContract.balanceOf(userAddress);
    document.getElementById('usdt-balance').textContent =
      ethers.formatUnits(bal, usdtDecimals) + ' USDT';
  } catch(e) {}
}

function requireConnected() {
  if (!signer) { log('Connect wallet first', 'err'); return false; }
  return true;
}

// ─── TABS ──────────────────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['rounds','enter','admin'][i] === name);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${name}`).classList.add('active');
}

// ─── ROUNDS ────────────────────────────────────────────────────
async function loadRounds() {
  if (!requireConnected()) return;
  log('Loading active rounds…', 'info');
  try {
    const ids = await raffleContract.getActiveRounds();
    const container = document.getElementById('rounds-container');
    if (ids.length === 0) {
      container.innerHTML = '<div class="empty">No active rounds</div>';
      log('No active rounds found', 'info');
      return;
    }
    container.innerHTML = '<div class="round-grid" id="round-grid"></div>';
    const grid = document.getElementById('round-grid');
    for (const id of ids) {
      const r = await raffleContract.getRound(id);
      grid.innerHTML += buildRoundCard(r);
    }
    log(`Loaded ${ids.length} round(s)`, 'ok');
  } catch(e) { log(e.reason || e.message, 'err'); }
}

function buildRoundCard(r) {
  const id        = Number(r.roundId);
  const stateName = STATE_NAMES[r.state] || '?';
  const players   = r.players.length;
  const max       = Number(r.maxPlayers);
  const price     = ethers.formatUnits(r.ticketPrice, usdtDecimals);
  const pool      = (players * parseFloat(price)).toFixed(2);
  const pct       = max > 0 ? Math.round(players / max * 100) : 0;
  const winner    = r.winner !== ethers.ZeroAddress
    ? `${r.winner.slice(0,6)}…${r.winner.slice(-4)}` : '—';
  return `
  <div class="round-card">
    <div class="round-id">ROUND #${id}</div>
    <div class="round-state state-${stateName}">${stateName}</div>
    <div class="round-stat"><span>Ticket</span><span>${price} USDT</span></div>
    <div class="round-stat"><span>Players</span><span>${players} / ${max}</span></div>
    <div class="round-stat"><span>Pool</span><span>${pool} USDT</span></div>
    <div class="round-stat"><span>Fee</span><span>${Number(r.protocolFeePercentage)}%</span></div>
    ${stateName === 'COMPLETED' ? `<div class="round-stat"><span>Winner</span><span>${winner}</span></div>` : ''}
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="round-actions">
      ${stateName === 'OPEN' ? `<button class="btn btn-primary" onclick="quickEnter(${id})">Enter</button>` : ''}
    </div>
  </div>`;
}

function quickEnter(id) {
  document.getElementById('enter-roundId').value = id;
  showTab('enter');
}

// ─── MINT ──────────────────────────────────────────────────────
async function doMint() {
  if (!requireConnected()) return;
  try {
    const amount = ethers.parseUnits('1000', usdtDecimals);
    log('Minting 1000 MockUSDT…', 'info');
    const tx = await usdtContract.mint(userAddress, amount);
    logTx(tx.hash);
    await tx.wait();
    log('Minted 1000 USDT to your wallet', 'ok');
    refreshBalance();
  } catch(e) { log(e.reason || e.message, 'err'); }
}

// ─── ENTER ─────────────────────────────────────────────────────
async function doEnter() {
  if (!requireConnected()) return;
  const roundId = document.getElementById('enter-roundId').value;
  if (roundId === '') { log('Enter a round ID', 'err'); return; }
  try {
    const r     = await raffleContract.getRound(roundId);
    const price = r.ticketPrice;
    log(`Approving ${ethers.formatUnits(price, usdtDecimals)} USDT…`, 'info');
    const approveTx = await usdtContract.approve(CONTRACT_ADDR, price);
    logTx(approveTx.hash);
    await approveTx.wait();
    log('Approved. Entering round…', 'info');
    const enterTx = await raffleContract.enter(roundId);
    logTx(enterTx.hash);
    await enterTx.wait();
    log(`Entered round #${roundId}`, 'ok');
    refreshBalance();
  } catch(e) { log(e.reason || e.message, 'err'); }
}

// ─── ADMIN ─────────────────────────────────────────────────────
async function doCreateRound() {
  if (!requireConnected()) return;
  const price = document.getElementById('cr-price').value;
  const max   = document.getElementById('cr-max').value;
  const fee   = document.getElementById('cr-fee').value;
  if (!price || !max || fee === '') { log('Fill all fields', 'err'); return; }
  try {
    const priceBN = ethers.parseUnits(price, usdtDecimals);
    log(`Creating round: ${price} USDT × ${max} players, ${fee}% fee…`, 'info');
    const tx = await raffleContract.createRound(priceBN, max, fee);
    logTx(tx.hash);
    const receipt = await tx.wait();
    const iface = new ethers.Interface(RAFFLE_ABI);
    for (const evlog of receipt.logs) {
      try {
        const parsed = iface.parseLog(evlog);
        if (parsed && parsed.name === 'RoundCreated') {
          log(`Round #${parsed.args.roundId} created ✓`, 'ok');
        }
      } catch {}
    }
  } catch(e) { log(e.reason || e.message, 'err'); }
}

async function doDrawWinner() {
  if (!requireConnected()) return;
  const roundId = document.getElementById('adm-roundId').value;
  if (roundId === '') { log('Enter a round ID', 'err'); return; }
  try {
    log(`Requesting VRF for round #${roundId}…`, 'info');
    const tx = await raffleContract.drawWinner(roundId);
    logTx(tx.hash);
    await tx.wait();
    log('VRF request sent — waiting for Chainlink callback (usually <1 min)', 'ok');
  } catch(e) { log(e.reason || e.message, 'err'); }
}

async function doFreeze() {
  if (!requireConnected()) return;
  const roundId = document.getElementById('adm-roundId').value;
  if (roundId === '') { log('Enter a round ID', 'err'); return; }
  try {
    log(`Freezing round #${roundId}…`, 'info');
    const tx = await raffleContract.freezeRound(roundId);
    logTx(tx.hash);
    await tx.wait();
    log(`Round #${roundId} frozen`, 'ok');
  } catch(e) { log(e.reason || e.message, 'err'); }
}

async function doManualDraw() {
  if (!requireConnected()) return;
  const roundId = document.getElementById('adm-roundId').value;
  const idx     = document.getElementById('adm-winnerIdx').value;
  if (roundId === '' || idx === '') { log('Fill round ID and winner index', 'err'); return; }
  try {
    log(`Manual pick: round #${roundId} index ${idx}…`, 'info');
    const tx = await raffleContract.manualDrawWinner(roundId, idx);
    logTx(tx.hash);
    await tx.wait();
    log(`Winner picked for round #${roundId}`, 'ok');
  } catch(e) { log(e.reason || e.message, 'err'); }
}

async function doAdminRefund() {
  if (!requireConnected()) return;
  const roundId = document.getElementById('adm-refund-roundId').value;
  const player  = document.getElementById('adm-refund-player').value.trim();
  if (roundId === '') { log('Enter a round ID', 'err'); return; }
  try {
    if (player === '' || player === '0x') {
      log(`Refunding ALL in round #${roundId}…`, 'info');
      const tx = await raffleContract.refundAll(roundId);
      logTx(tx.hash);
      await tx.wait();
      log(`All refunded in round #${roundId}`, 'ok');
    } else {
      log(`Refunding ${player}…`, 'info');
      const tx = await raffleContract.refundPlayer(roundId, player);
      logTx(tx.hash);
      await tx.wait();
      log(`Refunded ${player}`, 'ok');
    }
  } catch(e) { log(e.reason || e.message, 'err'); }
}

async function loadFees() {
  if (!requireConnected()) return;
  try {
    const fees = await raffleContract.unclaimedFees();
    document.getElementById('fees-display').textContent =
      ethers.formatUnits(fees, usdtDecimals) + ' USDT';
  } catch(e) { log(e.reason || e.message, 'err'); }
}

async function doWithdrawFees() {
  if (!requireConnected()) return;
  try {
    log('Withdrawing fees…', 'info');
    const tx = await raffleContract.withdrawFees();
    logTx(tx.hash);
    await tx.wait();
    log('Fees withdrawn', 'ok');
    loadFees();
    refreshBalance();
  } catch(e) { log(e.reason || e.message, 'err'); }
}
